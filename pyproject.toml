[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytorch-playground"
version = "0.1.0"
description = "PyTorch experiments and models"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "jupyter",
    "scikit-learn",
    "tqdm",
    "datasets",
    "lightning",
    "tensorboard"
]

[tool.hatch.build.targets.wheel]
packages = ["AlexNet", "GoogLeNet", "utils", "custum_datasets", "trainer_v2"]
